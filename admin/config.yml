      - { name: file,  label: "첨부파일 (PDF 등)", widget: file, required: false }
      - { name: body,  label: 본문, widget: markdown, required: false }

  # ───────────────────────── 논문 (Publications)
  - name: publications
    label: 논문
    label_singular: 논문
    folder: content/publications
    create: true
    slug: "{{year}}-{{slug}}"
    summary: "{{year}} · {{body}}"
    media_folder: /assets/publications/papers
    public_folder: assets/publications/papers
    fields:
      - { name: num,  label: "번호 (비우면 해당 연도 맨 위)", widget: number, required: false, value_type: int }
      - { name: year, label: 연도, widget: number, value_type: int, required: false }
      - { name: pdf,  label: "논문 PDF (올리면 papers 폴더에 저장)", widget: file, required: false }
      - { name: body, label: "인용 정보 (저자·제목·저널 — <b> <i> 태그 가능)", widget: text }

  # ───────────────────────── 구성원 (Members)
  - name: members
    label: 구성원
    label_singular: 구성원
    folder: content/people/members
    create: true
    slug: "{{fields.group}}-{{order}}-{{slug}}"
    summary: "[{{group}}] {{name}} ({{role}})"
    media_folder: /assets/people/photos
    public_folder: people/photos
    fields:
      - { name: name, label: 이름, widget: string }
      - name: group
        label: 그룹
        widget: select
        options:
          - { label: "연구교수 (resprof)", value: resprof }
          - { label: "박사후연구원 (postdoc)", value: postdoc }
          - { label: "대학원생 (grad)", value: grad }
          - { label: "학부연구생 (undergrad)", value: undergrad }
      - { name: role,  label: 과정, widget: string }
      - { name: order, label: 순번, widget: number, value_type: int }
      - { name: email, label: 이메일, widget: string, required: false }
      - { name: research, label: 연구분야, widget: string, required: false }
      - { name: photo, label: 사진, widget: image, required: false }

  # ───────────────────────── 페이지 (Main page · Research)
  - name: pages
    label: 페이지
    media_folder: /assets/images
    public_folder: assets/images
    files:
      - name: home
        label: 메인 페이지
        file: content/pages/home.md
        fields:
          - { name: hero_title, label: 메인 페이지 제목, widget: string }
          - { name: hero_intro, label: 메인 페이지 소개, widget: text }
          - { name: hero_image, label: 메인 페이지 이미지, widget: image, required: false, media_folder: /assets/images, public_folder: images }
          - { name: address, label: 주소, widget: string }
          - { name: office_prof, label: 교수연구실, widget: string }
          - { name: office_student, label: 학생연구실, widget: string }
          - { name: tel, label: TEL, widget: string }
          - { name: fax, label: FAX, widget: string }
          - { name: email, label: Email, widget: string }
          - { name: mailing, label: Mailing Address, widget: text }
      - name: research_ko
        label: Research (한국어)
        file: content/pages/research-ko.md
        fields:
          - { name: body, label: 본문, widget: markdown }
      - name: research_en
        label: Research (English)
        file: content/pages/research-en.md
        fields:
          - { name: body, label: 본문, widget: markdown }

  # ───────────────────────── People 상세 (PI · 졸업생 · 사진)
  - name: people_extra
    label: People 상세
    files:
      - name: pi
        label: 교수 (PI)
        file: content/people/pi.md
        fields:
          - { name: name, label: 이름, widget: string }
          - { name: name_en, label: 영문명, widget: string, required: false }
          - { name: role, label: 직함, widget: string }
          - { name: email, label: 이메일, widget: string, required: false }
          - { name: phone, label: 전화, widget: string, required: false }
          - { name: photo, label: 사진, widget: image, required: false, media_folder: /assets/images, public_folder: images }
          - { name: body, label: 본문 (학력·경력), widget: markdown, required: false }
      - name: alumni
        label: 졸업생
        file: content/people/alumni.md
        fields:
          - { name: title, label: 제목, widget: hidden, default: 졸업생 }
          - name: people
            label: 졸업생 목록
            widget: list
            fields:
              - { name: name, label: 이름, widget: string }
              - { name: period, label: 과정·기간, widget: string }
      - name: gallery
        label: 사진 갤러리
        file: content/people/gallery.md
        fields:
          - { name: title, label: 제목, widget: hidden, default: 사진 }
          - name: photos
            label: 사진 목록
            widget: list
            fields:
              - { name: image, label: 이미지, widget: image, media_folder: /assets/people/photos, public_folder: people/photos }
              - { name: date, label: 날짜, widget: string }
              - { name: caption, label: 설명, widget: string }

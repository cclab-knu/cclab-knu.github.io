# CCLab@KNU 관리자(CMS) 설정 — Sveltia CMS (Decap 호환)
# repo 이름이 다르면 아래 repo 값을 실제 저장소(owner/name)로 바꾸세요.
# base_url 은 배포한 로그인용 Cloudflare Worker 주소로 바꾸세요(세팅 후).

backend:
  name: github
  repo: cclab-knu/cclab-knu.github.io          # ← 실제 저장소명으로
  branch: main
  base_url: https://cclab-knu.ihchoi.workers.dev   # ← 배포한 Worker 주소로 교체

media_folder: assets/uploads
public_folder: assets/uploads

locale: ko

collections:
  # ───────────────────────── 소식 (News)
  - name: news
    label: 소식
    label_singular: 소식
    folder: content/news
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{date}} · {{title}}"
    media_folder: /assets/news
    public_folder: assets/news
    fields:
      - { name: title, label: 제목, widget: string }
      - { name: date,  label: 날짜, widget: datetime, date_format: "YYYY.MM.DD", time_format: false, format: "YYYY.MM.DD" }
      - { name: body,  label: 본문, widget: markdown, required: false }

  # ───────────────────────── 강의자료 (Courses) — 게시판마다 별도 컬렉션
